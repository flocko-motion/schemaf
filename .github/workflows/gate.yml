# The CI gate — the reference environment for schemaf (EXTEND.md › Testing the
# framework: the CI gate). Two parallel jobs, one per container runtime, each
# running the full suite (`make test all`) against the PR's head commit. The
# check `gate` is green only if both are; branch protection on main requires it.
#
# The e2e scripts are the single source of truth: this workflow only provisions
# the runner (compose provider, two real Unix users) and calls them.
name: gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch: # gh workflow run gate --ref <branch>

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.runtime }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runtime: [podman, docker]
    env:
      # What CI tests: the PR's head commit (manual run: the dispatched ref's
      # head), never refs/pull/<n>/merge, which the Go module proxy can't fetch.
      GATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SCHEMAF_RUNTIME: ${{ matrix.runtime }}
      # The oldest Go schemaf supports (go.mod's go directive, installed by
      # setup-go), never a newer toolchain: a dependency needing newer Go fails.
      GOTOOLCHAIN: local
      E2E_REFERENCE: "1"
      E2E_BUILD_USER: schemaf-build
      E2E_RUN_USER: schemaf-run
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.GATE_SHA }}
          persist-credentials: false

      # Caches: downloads only. Never container storage, images, volumes or
      # database state — every run starts from a clean slate.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # No package-lock.json in this repo: what a new project installs is
      # decided by the scaffold's package.json template.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('cli/cmd/codegen/scaffold/package.json.tmpl') }}

      - name: Container runtimes
        run: |
          set -euo pipefail
          # podman compose must hand off to docker-compose (Compose v2). The
          # image ships it as Docker's CLI plugin; put it on PATH for podman.
          plugin=/usr/libexec/docker/cli-plugins/docker-compose
          if ! command -v docker-compose >/dev/null; then
            [ -x "$plugin" ] || { echo "::error::docker-compose is neither on PATH nor at $plugin"; exit 1; }
            sudo ln -s "$plugin" /usr/local/bin/docker-compose
          fi
          podman version
          docker version
          for rt in podman docker; do
            out=$($rt compose version 2>&1) || true
            case "$out" in
              *"Docker Compose version"*) echo "$rt compose: $out" ;;
              *) echo "::error::$rt compose is not docker-compose: $out"; exit 1 ;;
            esac
          done

      - name: Two real users (build, run)
        run: |
          set -euo pipefail
          # The runner image writes XDG_CONFIG_HOME=$HOME/.config into
          # /etc/environment, and its post-gen script expands $HOME to
          # /home/runner. pam_env applies it to every user sudo switches to, so
          # the created users would read podman's config from the runner's
          # home. A real server has no such entry: remove it. (The runner's own
          # job environment was set at startup and keeps its value.)
          sudo sed -i '/^XDG_CONFIG_HOME=/d' /etc/environment
          for u in "$E2E_BUILD_USER" "$E2E_RUN_USER"; do
            sudo useradd --create-home --shell /bin/bash "$u"
            home=$(getent passwd "$u" | cut -d: -f6)
            xdg=$(sudo -H -u "$u" env | sed -n 's/^XDG_CONFIG_HOME=//p')
            case "$xdg" in
              "" | "$home" | "$home"/*) ;;
              *) echo "::error::$u gets XDG_CONFIG_HOME=$xdg, outside its home $home (from /etc/environment?)"; exit 1 ;;
            esac
            # rootless podman needs subordinate IDs and a runtime dir (lingering)
            grep -q "^$u:" /etc/subuid || { echo "::error::useradd gave $u no /etc/subuid range"; exit 1; }
            grep -q "^$u:" /etc/subgid || { echo "::error::useradd gave $u no /etc/subgid range"; exit 1; }
            sudo loginctl enable-linger "$u"
            uid=$(id -u "$u")
            for _ in $(seq 1 30); do [ -d "/run/user/$uid" ] && break; sleep 1; done
            [ -d "/run/user/$uid" ] || { echo "::error::/run/user/$uid did not appear after enable-linger $u"; exit 1; }
            # under Docker both users share the machine's daemon
            if [ "$SCHEMAF_RUNTIME" = docker ]; then sudo usermod -aG docker "$u"; fi
          done

      # podman compose hands off to docker-compose, which talks to podman
      # through the user's API socket (INSTALL.md › Prerequisites). Started for
      # every user that runs compose: the runner (test, dev, instances) and the
      # run user. Not the build user: build and load don't use compose.
      - name: podman API sockets (runner, run user)
        if: matrix.runtime == 'podman'
        run: |
          set -euo pipefail
          sudo loginctl enable-linger "$USER"
          # socket_diagnostics <user>: everything that explains a dead socket.
          socket_diagnostics() {
            local u=$1 uid
            uid=$(id -u "$u")
            echo "::group::podman socket diagnostics for $u (uid $uid)"
            if [ "$u" = "$USER" ]; then
              env XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user status podman.socket podman.service --no-pager || true
              env XDG_RUNTIME_DIR="/run/user/$uid" systemctl --user show-environment || true
            else
              sudo systemctl --user -M "$u@" status podman.socket podman.service --no-pager || true
              sudo systemctl --user -M "$u@" show-environment || true
            fi
            systemctl status "user@$uid.service" --no-pager || true
            sudo journalctl --no-pager -n 100 _UID="$uid" || true
            sudo journalctl --no-pager -n 50 "_SYSTEMD_USER_UNIT=podman.service" _UID="$uid" || true
            sudo ls -la "/run/user/$uid" "/run/user/$uid/podman" || true
            echo "-- $u's environment through sudo -H (HOME, XDG_*):"
            sudo -H -u "$u" env | grep -E '^(HOME|XDG_)' || true
            echo "-- where a leaked XDG_RUNTIME_DIR could come from:"
            env | grep -E '^XDG_' || true
            grep -E '^XDG_' /etc/environment || true
            sudo grep -rhE '^[[:space:]]*Defaults' /etc/sudoers /etc/sudoers.d 2>/dev/null || true
            sudo sudo -V | sed -n '/Environment variables to preserve/,/^$/p' || true
            echo "::endgroup::"
          }

          # wait_socket <user> <systemctl...>: podman.socket is active (bounded)
          wait_socket() {
            local u=$1
            shift
            for _ in $(seq 1 15); do "$@" is-active --quiet podman.socket && return 0; sleep 1; done
            echo "::error::podman.socket of $u is not active after enable --now"
            socket_diagnostics "$u"
            exit 1
          }

          # ping_socket <user> <cmd prefix...>: podman's API socket of <user>
          # answers. A few tries: the first connection starts podman.service.
          ping_socket() {
            local u=$1 run
            shift
            run=/run/user/$(id -u "$u")
            for _ in 1 2 3 4 5; do
              if "$@" env XDG_RUNTIME_DIR="$run" podman --remote --url "unix://$run/podman/podman.sock" version >/dev/null; then
                echo "podman API socket answers for $u: unix://$run/podman/podman.sock"
                return 0
              fi
              sleep 2
            done
            echo "::error::podman's API socket for $u doesn't answer at unix://$run/podman/podman.sock"
            socket_diagnostics "$u"
            exit 1
          }

          # The runner: its user systemd is reachable through its own bus.
          run=/run/user/$(id -u)
          for _ in $(seq 1 30); do [ -S "$run/bus" ] && break; sleep 1; done
          [ -S "$run/bus" ] || { echo "::error::$run/bus did not appear: no user systemd for $USER (lingering?)"; exit 1; }
          as_runner_systemd=(env XDG_RUNTIME_DIR="$run" DBUS_SESSION_BUS_ADDRESS="unix:path=$run/bus" systemctl --user)
          "${as_runner_systemd[@]}" enable --now podman.socket
          wait_socket "$USER" "${as_runner_systemd[@]}"
          ping_socket "$USER"

          # The run user: through systemd's machine transport (systemd >= 248),
          # once lingering has started its user@<uid>.service. Its manager
          # started after /etc/environment was cleaned (previous step), so it
          # needs no restart.
          u=$E2E_RUN_USER
          svc="user@$(id -u "$u").service"
          for _ in $(seq 1 30); do systemctl is-active --quiet "$svc" && break; sleep 1; done
          systemctl is-active --quiet "$svc" || { echo "::error::$svc is not active: no user systemd for $u (lingering?)"; systemctl status "$svc" --no-pager || true; exit 1; }
          sudo systemctl --user --machine="$u@" enable --now podman.socket
          wait_socket "$u" sudo systemctl --user --machine="$u@"
          ping_socket "$u" sudo -H -u "$u"   # -H: its own HOME (podman reads ~/.config/containers)

          # the runner's own podman and systemctl find its runtime dir from here on
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"

      - name: make test all (unit, db, onboarding e2e with two-user deploy and data-volume check)
        run: make test all REF="$GATE_SHA"

  gate:
    name: gate
    needs: e2e
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: both runtimes green
        env:
          RESULT: ${{ needs.e2e.result }}
        run: |
          if [ "$RESULT" != success ]; then
            echo "::error::the podman and docker jobs must both pass (result: $RESULT)"
            exit 1
          fi
          echo "podman and docker jobs passed"
